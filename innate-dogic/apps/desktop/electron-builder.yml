appId: com.innateos.dsh
productName: DSH InnateOS
copyright: InnateOS
directories:
  output: dist-package
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  # M2 simple 模式 overlay，运行时经 process.resourcesPath 读取
  - from: resources/innate-simple.patch.yml
    to: innate-simple.patch.yml
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
